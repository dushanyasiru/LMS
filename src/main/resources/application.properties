# ---- App ----
spring.application.name=ict-tuition-lms
server.port=8080

# Include the error reason in JSON responses (so the UI can show "Invalid email or password")
server.error.include-message=always

# ---- Fast startup (bind the port quickly on short cold-start limits, e.g. Vercel's 15s) ----
# NOTE: lazy-initialization is intentionally OFF. With the CDS archive (fast
# class loading) + deferred JPA bootstrap (below), Tomcat already binds in ~3s
# without it. Turning it ON would defer the whole web layer (DispatcherServlet +
# controllers) to the FIRST request, making that request take ~10s and sometimes
# time out. Off = web layer ready at bind; only real DB queries wait for the
# background EntityManagerFactory.
spring.main.lazy-initialization=false
# Build the JPA EntityManagerFactory on a background thread so Tomcat can bind the
# port immediately (lazy-init alone does NOT defer the EMF bootstrap). Hibernate +
# the Supabase connection (~8s of the cold start) then finish off the critical path;
# the security chain and /api/ping don't touch the DB, so requests work right away.
spring.data.jpa.repositories.bootstrap-mode=deferred
# Naming the dialect avoids a DB metadata round-trip during Hibernate init.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- Secrets & DB config live in application-secret.properties ----
# (that file is git-ignored so passwords never get committed)
spring.config.import=optional:application-secret.properties

# ---- JPA / Hibernate ----
# 'update' lets Hibernate create/alter tables to match our entities automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Uncomment to see the SQL Hibernate runs:
# spring.jpa.show-sql=true

# ---- Connection pool (sized for the Supabase pooler + many Vercel instances) ----
# The Supabase session-mode pooler caps TOTAL clients at 15. Vercel can run
# several container instances at once, so keep each instance's footprint tiny:
# at most 2 connections, none held while idle, released quickly back to the
# pooler. This lets ~7 instances coexist under the 15-client cap instead of 3.
# (For heavier multi-instance use, point SPRING_DATASOURCE_URL at Supabase's
# transaction pooler on port 6543 and add ?prepareThreshold=0 — it multiplexes
# and has no per-client cap.)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# ---- File uploads ----
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
