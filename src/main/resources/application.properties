# ---- App ----
spring.application.name=ict-tuition-lms
server.port=8080

# Include the error reason in JSON responses (so the UI can show "Invalid email or password")
server.error.include-message=always

# ---- Fast startup (bind the port quickly on short cold-start limits, e.g. Vercel's 15s) ----
# Lazy init lets Tomcat open the port before the DB/Hibernate work happens.
spring.main.lazy-initialization=true
# Build the JPA EntityManagerFactory on a background thread so Tomcat can bind the
# port immediately (lazy-init alone does NOT defer the EMF bootstrap). Hibernate +
# the Supabase connection (~8s of the cold start) then finish off the critical path;
# the security chain and /api/ping don't touch the DB, so requests work right away.
spring.data.jpa.repositories.bootstrap-mode=deferred
# Naming the dialect avoids a DB metadata round-trip during Hibernate init.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- Secrets & DB config live in application-secret.properties ----
# (that file is git-ignored so passwords never get committed)
spring.config.import=optional:application-secret.properties

# ---- JPA / Hibernate ----
# 'update' lets Hibernate create/alter tables to match our entities automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Uncomment to see the SQL Hibernate runs:
# spring.jpa.show-sql=true

# ---- Connection pool (kept small for Supabase free-tier pooler) ----
spring.datasource.hikari.maximum-pool-size=5

# ---- File uploads ----
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
