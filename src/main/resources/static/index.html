<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stack ICT Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="root"></div>

  <!-- No-build React: loaded from CDN, JSX compiled in the browser by Babel. -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const APP_NAME = "Stack ICT Academy";
    const CONTACT_PHONE = "0703974113";
    // WhatsApp uses the international format: 0703974113 -> +94 703974113
    const WHATSAPP_NUMBER = "94703974113";
    const waLink = (text) => "https://wa.me/" + WHATSAPP_NUMBER + (text ? "?text=" + encodeURIComponent(text) : "");
    const WHATSAPP = waLink("Hi, I'd like to know about the ICT classes.");
    const TOKEN_KEY = "lms_token";
    // Separate exam site — its own login, so it opens in a new tab.
    const EXAMS_URL = "https://stack-exams-ten.vercel.app/login";

    // ============================================================
    //  API helper
    // ============================================================
    // Auth token lives in sessionStorage (NOT localStorage) so it is cleared
    // when the window/tab is closed. On a shared classroom PC this means the
    // next person must log in again instead of inheriting the previous session.
    const api = {
      token: () => sessionStorage.getItem(TOKEN_KEY),
      setToken: (t) => sessionStorage.setItem(TOKEN_KEY, t),
      clear: () => sessionStorage.removeItem(TOKEN_KEY),

      async request(path, opts = {}) {
        const headers = Object.assign({}, opts.headers);
        if (api.token()) headers["Authorization"] = "Bearer " + api.token();
        if (opts.body && !(opts.body instanceof FormData)) headers["Content-Type"] = "application/json";
        const res = await fetch(path, Object.assign({}, opts, { headers }));
        if (!res.ok) {
          let msg = "Request failed (" + res.status + ")";
          try { const j = await res.json(); if (j.message) msg = j.message; } catch (e) {}
          throw new Error(msg);
        }
        const ct = res.headers.get("content-type") || "";
        return ct.includes("application/json") ? res.json() : res;
      },

      // Download a protected file (sends the JWT, then saves the blob).
      async downloadFile(url, filename) {
        const headers = {};
        if (api.token()) headers["Authorization"] = "Bearer " + api.token();
        const res = await fetch(url, { headers });
        if (!res.ok) { alert("Download failed (" + res.status + ")"); return; }
        const blob = await res.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename || "download";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      },

      login: (email, password) =>
        api.request("/api/auth/login", { method: "POST", body: JSON.stringify({ email, password }) }),
      me: () => api.request("/api/auth/me"),

      lessons: {
        list: (grade) => api.request("/api/lessons" + (grade ? "?grade=" + grade : "")),
        create: (data) => api.request("/api/lessons", { method: "POST", body: JSON.stringify(data) }),
        remove: (id) => api.request("/api/lessons/" + id, { method: "DELETE" }),
      },
      resources: {
        list: (grade, category) => {
          const p = new URLSearchParams();
          if (grade) p.set("grade", grade);
          if (category) p.set("category", category);
          const qs = p.toString();
          return api.request("/api/resources" + (qs ? "?" + qs : ""));
        },
        upload: (formData) => api.request("/api/resources", { method: "POST", body: formData }),
        remove: (id) => api.request("/api/resources/" + id, { method: "DELETE" }),
        downloadUrl: (id) => "/api/resources/" + id + "/download",
      },
      assignments: {
        list: (grade) => api.request("/api/assignments" + (grade ? "?grade=" + grade : "")),
        create: (formData) => api.request("/api/assignments", { method: "POST", body: formData }),
        remove: (id) => api.request("/api/assignments/" + id, { method: "DELETE" }),
        questionUrl: (id) => "/api/assignments/" + id + "/question",
      },
      students: {
        list: () => api.request("/api/students"),
        create: (data) => api.request("/api/students", { method: "POST", body: JSON.stringify(data) }),
        update: (id, data) => api.request("/api/students/" + id, { method: "PUT", body: JSON.stringify(data) }),
        remove: (id) => api.request("/api/students/" + id, { method: "DELETE" }),
        fees: (id) => api.request("/api/students/" + id + "/fees"),
        duesTotal: () => api.request("/api/students/dues-total"),
      },
      income: {
        monthly: () => api.request("/api/income/monthly"),
      },
      registrations: {
        list: () => api.request("/api/registrations"),
        setStatus: (id, status) => api.request("/api/registrations/" + id + "/status", { method: "PUT", body: JSON.stringify({ status }) }),
        remove: (id) => api.request("/api/registrations/" + id, { method: "DELETE" }),
      },
      teachers: {
        list: () => api.request("/api/teachers"),
        create: (data) => api.request("/api/teachers", { method: "POST", body: JSON.stringify(data) }),
        update: (id, data) => api.request("/api/teachers/" + id, { method: "PUT", body: JSON.stringify(data) }),
        remove: (id) => api.request("/api/teachers/" + id, { method: "DELETE" }),
      },
      submissions: {
        mine: () => api.request("/api/submissions/mine"),
        submit: (formData) => api.request("/api/submissions", { method: "POST", body: formData }),
        forAssignment: (assignmentId) => api.request("/api/submissions/assignment/" + assignmentId),
        grade: (id, data) => api.request("/api/submissions/" + id + "/grade", { method: "POST", body: JSON.stringify(data) }),
        downloadUrl: (id) => "/api/submissions/" + id + "/download",
      },
      notifications: {
        list: () => api.request("/api/notifications"),
        unreadCount: () => api.request("/api/notifications/unread-count"),
        markAllRead: () => api.request("/api/notifications/read-all", { method: "POST" }),
        clearAll: () => api.request("/api/notifications", { method: "DELETE" }),
      },
      classes: {
        list: () => api.request("/api/classes"),
        create: (data) => api.request("/api/classes", { method: "POST", body: JSON.stringify(data) }),
        update: (id, data) => api.request("/api/classes/" + id, { method: "PUT", body: JSON.stringify(data) }),
        remove: (id) => api.request("/api/classes/" + id, { method: "DELETE" }),
        sessions: (id) => api.request("/api/classes/" + id + "/sessions"),
        calendar: () => api.request("/api/classes/calendar"),
        addSession: (id, date) => api.request("/api/classes/" + id + "/sessions", { method: "POST", body: JSON.stringify({ date }) }),
        editSession: (id, sid, date) => api.request("/api/classes/" + id + "/sessions/" + sid, { method: "PUT", body: JSON.stringify({ date }) }),
        deleteSession: (id, sid) => api.request("/api/classes/" + id + "/sessions/" + sid, { method: "DELETE" }),
        fees: (id) => api.request("/api/classes/" + id + "/fees"),
        setFee: (id, studentId, status) => api.request("/api/classes/" + id + "/fees/" + studentId, { method: "PUT", body: JSON.stringify({ status }) }),
        available: (id) => api.request("/api/classes/" + id + "/available"),
        enroll: (id, studentId) => api.request("/api/classes/" + id + "/students", { method: "POST", body: JSON.stringify({ studentId }) }),
        unenroll: (id, studentId) => api.request("/api/classes/" + id + "/students/" + studentId, { method: "DELETE" }),
        sessionPayments: (id) => api.request("/api/classes/" + id + "/session-payments"),
        setSessionPayment: (id, sessionId, studentId, status, amount, paidOn) => api.request("/api/classes/" + id + "/session-payments", { method: "PUT", body: JSON.stringify({ sessionId, studentId, status, amount, paidOn }) }),
      },
      myFees: () => api.request("/api/my-fees"),
    };

    // Older builds stored the token in localStorage (persisted across window
    // closes). Remove any leftover so it can never auto-log-in the next person.
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}

    // ============================================================
    //  App root
    // ============================================================
    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [showLogin, setShowLogin] = useState(false);

      useEffect(() => {
        if (!api.token()) { setLoading(false); return; }
        api.me().then(setUser).catch(() => api.clear()).finally(() => setLoading(false));
      }, []);

      if (loading) return <Centered><p className="subtitle" style={{ margin: 0 }}>Loading…</p></Centered>;
      if (user) return <Dashboard user={user} onLogout={() => { api.clear(); setUser(null); }} />;
      if (showLogin) return <Login onLogin={setUser} onBack={() => setShowLogin(false)} />;
      return <Home onLogin={() => setShowLogin(true)} />;
    }

    function Centered({ children }) {
      return <div className="center-wrap"><div className="card" style={{ textAlign: "center" }}>{children}</div></div>;
    }

    // ============================================================
    //  Login
    // ============================================================
    function Login({ onLogin, onBack }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [msg, setMsg] = useState("");
      const [busy, setBusy] = useState(false);

      async function submit(e) {
        e.preventDefault();
        setBusy(true); setMsg("");
        try {
          const res = await api.login(email.trim(), password);
          api.setToken(res.token);
          onLogin(res.user);
        } catch (err) { setMsg(err.message); } finally { setBusy(false); }
      }

      return (
        <div className="center-wrap">
          <div className="live-bg" aria-hidden="true">
            <span className="blob b1"></span>
            <span className="blob b2"></span>
            <span className="blob b3"></span>
          </div>
          <form className="card" onSubmit={submit}>
            <img src="/img/logo.jpg" alt={APP_NAME} className="login-logo" />
            <p className="subtitle">Sign in to continue</p>
            <label>Email</label>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required autoFocus />
            <label>Password</label>
            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required />
            <button className="btn" disabled={busy}>{busy ? "Signing in…" : "Sign in"}</button>
            {msg && <p className="message error">{msg}</p>}
            {onBack && <p style={{ textAlign: "center", marginTop: 14 }}>
              <button type="button" className="text-link" onClick={onBack}>← Back to home</button>
            </p>}
          </form>
        </div>
      );
    }

    // ============================================================
    //  Public home / landing page
    // ============================================================
    // ---- small shared helpers for the public pages ----
    // "19:00" -> "7:00 PM";  ("19:00","21:00") -> "7:00 – 9:00 PM"
    function fmtTime(hhmm) {
      if (!hhmm) return "";
      const [h, m] = hhmm.split(":").map(Number);
      return (h % 12 || 12) + ":" + String(m).padStart(2, "0") + " " + (h >= 12 ? "PM" : "AM");
    }
    function fmtRange(a, b) {
      if (!a) return "";
      if (!b) return fmtTime(a);
      const A = fmtTime(a), B = fmtTime(b);
      return A.slice(-2) === B.slice(-2) ? A.slice(0, -3) + " – " + B : A + " – " + B;
    }
    // "2026-11-25" -> "Wed 25 Nov"
    function fmtShortDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }).replace(",", "");
    }

    function WhatsAppIcon({ size = 24 }) {
      return (
        <svg viewBox="0 0 24 24" width={size} height={size} fill="currentColor" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" />
        </svg>
      );
    }

    /** WhatsApp-green call-to-action showing the number; opens a chat with an optional ready-typed message. */
    function WhatsAppButton({ text, label = "Chat on WhatsApp", big }) {
      return (
        <a className={"wa-btn" + (big ? " big" : "")} href={text ? waLink(text) : WHATSAPP} target="_blank" rel="noopener noreferrer">
          <span className="wa-ico"><WhatsAppIcon size={big ? 30 : 26} /></span>
          <span className="wa-text">
            <span className="wa-label">{label}</span>
            <span className="wa-num">{CONTACT_PHONE}</span>
          </span>
        </a>
      );
    }

    /** Public: the active classes by day, with times and the next few class dates (no fees). */
    function Timetable() {
      const [items, setItems] = useState(null);   // null = loading
      useEffect(() => {
        api.request("/api/public/timetable").then(setItems).catch(() => setItems([]));
      }, []);
      const todayName = new Date().toLocaleDateString("en-US", { weekday: "long" });

      if (items === null) return <p className="muted tt-note">Loading timetable…</p>;
      if (items.length === 0) return <p className="muted tt-note">The class timetable will be announced soon. Message us on WhatsApp for details.</p>;

      const known = CLASS_DAYS;
      const byDay = (d) => items.filter(c => (c.dayOfWeek || "").trim() === d);
      const other = items.filter(c => !known.includes((c.dayOfWeek || "").trim()));
      const card = (c, i) => (
        <div className={"tt-class g" + c.grade} key={i}>
          <div className="tt-time">🕒 {c.startTime ? fmtRange(c.startTime, c.endTime) : "Time to be announced"}</div>
          <div className="tt-title">Grade {c.grade}{c.medium ? " · " + c.medium : ""}</div>
          {c.subject && <div className="tt-sub">{c.subject}</div>}
          {c.upcomingDates && c.upcomingDates.length > 0 && (
            <div className="tt-dates">
              <span className="tt-next">Next class: {fmtShortDate(c.upcomingDates[0])}</span>
              {c.upcomingDates.length > 1 && <span className="tt-more">Then {c.upcomingDates.slice(1).map(fmtShortDate).join(" · ")}</span>}
            </div>
          )}
        </div>
      );
      // Weekends only appear when there is actually a class on them.
      const days = known.filter(d => !["Saturday", "Sunday"].includes(d) || byDay(d).length > 0);
      return (
        <div className={"tt-grid cols-" + (days.length + (other.length > 0 ? 1 : 0))}>
          {days.map(d => {
            const list = byDay(d);
            return (
              <div className={"tt-day" + (d === todayName ? " today" : "")} key={d}>
                <div className="tt-dayhead"><span>{d}</span>{d === todayName && <em>Today</em>}</div>
                {list.length === 0 ? <div className="tt-empty">No classes</div> : list.map(card)}
              </div>
            );
          })}
          {other.length > 0 && (
            <div className="tt-day">
              <div className="tt-dayhead"><span>Other</span></div>
              {other.map(card)}
            </div>
          )}
        </div>
      );
    }

    /** Public: student registration (name, mobile, email, grade, medium). */
    function RegisterForm() {
      const blank = { fullName: "", mobile: "", email: "", grade: 10, medium: "Sinhala", website: "" };
      const [f, setF] = useState(blank);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState("");
      const [doneName, setDoneName] = useState(null);
      const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

      async function submit(e) {
        e.preventDefault(); setBusy(true); setErr("");
        try {
          await api.request("/api/public/register", { method: "POST", body: JSON.stringify({ ...f, grade: Number(f.grade) }) });
          setDoneName(f.fullName.trim()); setF(blank);
        } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
      }

      if (doneName) {
        return (
          <div className="reg-done">
            <div className="reg-tick">✓</div>
            <h3>Thank you{doneName ? ", " + doneName : ""}!</h3>
            <p className="muted">We've received your registration. We'll contact you soon on the mobile number you gave.</p>
            <WhatsAppButton text={"Hi, I just registered " + doneName + " for the ICT classes."} label="Message us on WhatsApp" />
            <p><button type="button" className="text-link" onClick={() => setDoneName(null)}>Register another student</button></p>
          </div>
        );
      }
      return (
        <form className="reg-form" onSubmit={submit} noValidate>
          <div className="field">
            <label>Student's full name</label>
            <input value={f.fullName} onChange={set("fullName")} placeholder="e.g. Kasun Perera" maxLength={100} required />
          </div>
          <div className="field-row">
            <div className="field">
              <label>Mobile number</label>
              <input value={f.mobile} onChange={set("mobile")} placeholder="07X XXX XXXX" inputMode="tel" required />
            </div>
            <div className="field">
              <label>Email</label>
              <input type="email" value={f.email} onChange={set("email")} placeholder="name@example.com" required />
            </div>
          </div>
          <div className="field">
            <label>Grade</label>
            <div className="seg">
              {STUDENT_GRADES.map(g => (
                <button type="button" key={g} className={"seg-btn" + (Number(f.grade) === g ? " on" : "")} onClick={() => setF({ ...f, grade: g })}>{g}</button>
              ))}
            </div>
          </div>
          <div className="field">
            <label>Medium</label>
            <div className="seg">
              {["Sinhala", "English"].map(m => (
                <button type="button" key={m} className={"seg-btn" + (f.medium === m ? " on" : "")} onClick={() => setF({ ...f, medium: m })}>{m}</button>
              ))}
            </div>
          </div>
          {/* honeypot: hidden from people, bots fill it and get ignored */}
          <input className="hp" tabIndex={-1} autoComplete="off" aria-hidden="true" value={f.website} onChange={set("website")} />
          {err && <p className="message error" style={{ textAlign: "left", margin: "4px 0 0" }}>{err}</p>}
          <button className="btn-login lg reg-submit" disabled={busy}>{busy ? "Sending…" : "Register now"}</button>
          <p className="reg-consent">Your mobile number and email are only seen by the teacher, to contact you about classes.</p>
        </form>
      );
    }

    function Home({ onLogin }) {
      const go = (id) => (e) => {
        e.preventDefault();
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      const rootRef = useRef(null);

      // Gentle fade/slide-up as sections scroll into view (content stays visible if this can't run).
      useEffect(() => {
        const root = rootRef.current;
        const els = root ? root.querySelectorAll(".reveal") : [];
        if (!("IntersectionObserver" in window) || els.length === 0) return;
        root.classList.add("reveal-ready");
        const io = new IntersectionObserver((entries) => entries.forEach(en => {
          if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
        }), { threshold: 0.1 });
        els.forEach(el => io.observe(el));
        return () => io.disconnect();
      }, []);

      return (
        <div className="home" ref={rootRef}>
          <div className="home-bg" aria-hidden="true">
            <span className="blob hb1"></span>
            <span className="blob hb2"></span>
            <span className="blob hb3"></span>
          </div>

          <header className="home-header">
            <img src="/img/logo.jpg" alt={APP_NAME} className="home-logo" />
            <nav className="home-nav">
              <a href="#about" onClick={go("about")}>About</a>
              <a href="#timetable" onClick={go("timetable")}>Timetable</a>
              <a href="#register" onClick={go("register")}>Register</a>
              <a href="#contact" onClick={go("contact")}>Contact</a>
              <button className="btn-login" onClick={onLogin}>Login</button>
            </nav>
          </header>

          <section className="hero">
            <div className="hero-text">
              <span className="badge">STACK ICT ACADEMY</span>
              <h1 className="hero-title">Master <span className="accent">ICT</span> — Now At Your Fingertips!</h1>
              <div className="teacher-block">
                <p className="t-name">Dushan Samarawickrama</p>
                <p className="t-role">Senior Software Engineer</p>
                <p className="t-qual">MSc in Advanced Software Engineering</p>
                <p className="t-qual">BSc in Software Engineering</p>
              </div>
              <div className="cta-row">
                <a className="btn-login lg" href="#register" onClick={go("register")}>Register now</a>
                <button className="btn-ghost lg" onClick={onLogin}>Student login</button>
              </div>
              <div className="hero-wa"><WhatsAppButton big text="Hi, I'd like to know about the ICT classes." /></div>
            </div>
            <div className="hero-photo">
              <div className="photo-blob"></div>
              <img src="/img/teacher.jpg" alt="Dushan Samarawickrama" />
            </div>
          </section>

          <section className="tt-sec reveal" id="timetable">
            <h2 className="section-title">Class timetable</h2>
            <p className="section-sub">Our current weekly classes and the next class dates.</p>
            <Timetable />
          </section>

          <section className="reg-sec reveal" id="register">
            <div className="reg-card">
              <div className="reg-pitch">
                <h2>Join the classes</h2>
                <p>Register in a minute and we'll contact you with the class details.</p>
                <ul>
                  <li>Grade 6 – 11, Sinhala &amp; English medium</li>
                  <li>Lecture notes, past &amp; model papers online</li>
                  <li>Assignments marked with personal feedback</li>
                </ul>
                <WhatsAppButton text="Hi, I'd like to join the ICT classes." label="Prefer to chat?" />
              </div>
              <div className="reg-formwrap"><RegisterForm /></div>
            </div>
          </section>

          <section className="about-sec reveal" id="about">

    // ============================================================
    //  Teacher notification centre (bell + dropdown)
    // ============================================================
    function timeAgo(iso) {
      const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 60) return "just now";
      const m = Math.floor(s / 60); if (m < 60) return m + "m ago";
      const h = Math.floor(m / 60); if (h < 24) return h + "h ago";
      const d = Math.floor(h / 24); if (d < 7) return d + "d ago";
      return new Date(iso).toLocaleDateString();
    }

    function NotificationBell() {
      const [open, setOpen] = useState(false);
      const [items, setItems] = useState([]);
      const [count, setCount] = useState(0);
      const wrapRef = useRef();

      async function refreshCount() {
        try { const r = await api.notifications.unreadCount(); setCount(r.count || 0); } catch (e) {}
      }
      // Poll the unread count on mount and every 30s.
      useEffect(() => {
        refreshCount();
        const t = setInterval(refreshCount, 30000);
        return () => clearInterval(t);
      }, []);
      // Close when clicking outside the bell/dropdown.
      useEffect(() => {
        function onDoc(e) { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); }
        document.addEventListener("mousedown", onDoc);
        return () => document.removeEventListener("mousedown", onDoc);
      }, []);

      async function toggle() {
        if (open) { setOpen(false); return; }
        setOpen(true);
        try {
          setItems(await api.notifications.list());
          await api.notifications.markAllRead();   // opening the centre clears the badge
          setCount(0);
        } catch (e) { alert(e.message); }
      }
      async function clearAll() {
        try { await api.notifications.clearAll(); setItems([]); setCount(0); } catch (e) { alert(e.message); }
      }

      return (
        <div className="notif" ref={wrapRef}>
          <button className="icon-btn notif-bell" title="Notifications" onClick={toggle}>
            🔔{count > 0 && <span className="notif-badge">{count > 99 ? "99+" : count}</span>}
          </button>
          {open && (
            <div className="notif-panel">
              <div className="notif-head">
                <b>Notifications</b>
                {items.length > 0 && <button className="link-btn" onClick={clearAll}>Clear all</button>}
              </div>
              {items.length === 0
                ? <p className="muted" style={{ padding: "14px 16px", margin: 0 }}>No notifications yet.</p>
                : <ul className="notif-list">
                    {items.map(n => (
                      <li key={n.id} className={n.read ? "" : "unread"}>
                        <div className="notif-msg">{n.message}</div>
                        <div className="notif-meta">
                          <span className="muted">{timeAgo(n.createdAt)}</span>
                          {n.submissionId &&
                            <button className="link-btn" onClick={() => api.downloadFile(api.submissions.downloadUrl(n.submissionId), n.fileName || "submission")}>Download</button>}
                        </div>
                      </li>
                    ))}
                  </ul>}
            </div>
          )}
        </div>
      );
    }

    /** Teacher: pick a student → see their pending days + pending total, class by class. */
    function DuesPanel() {
      const [students, setStudents] = useState([]);
      const [sel, setSel] = useState("");
      const [classes, setClasses] = useState([]);
      const [loading, setLoading] = useState(false);
      const [overall, setOverall] = useState(null);   // academy-wide outstanding

      useEffect(() => {
        (async () => {
          try { setStudents(await api.students.list()); } catch (e) { alert(e.message); }
          try { setOverall(await api.students.duesTotal()); } catch (e) { /* headline is best-effort */ }
        })();
      }, []);

      async function pick(id) {
        setSel(id);
        if (!id) { setClasses([]); return; }
        setLoading(true);
        try { setClasses(await api.students.fees(Number(id))); }
        catch (e) { alert(e.message); setClasses([]); }
        finally { setLoading(false); }
      }

      // Per class: pending days + total (pending days × class fee).
      const perClass = classes.map(c => {
        const pendingDays = c.days.filter(d => d.status === "PENDING");
        const fee = c.monthlyFee || 0;
        return { ...c, pendingDays, pendingCount: pendingDays.length, pendingTotal: pendingDays.length * fee };
      });
      const grandDays = perClass.reduce((n, c) => n + c.pendingCount, 0);
      const grandTotal = perClass.reduce((n, c) => n + c.pendingTotal, 0);
      const chosen = students.find(s => String(s.id) === String(sel));

      return (
        <div className="card">
          <div className="dues-head">
            <div>
              <h3 style={{ marginTop: 0 }}>Student Dues <span className="muted" style={{ fontWeight: 400, fontSize: "0.8rem" }}> · pending fees, class by class</span></h3>
              <select value={sel} onChange={e => pick(e.target.value)} style={{ maxWidth: 360 }}>
                <option value="">Select a student…</option>
                {students.map(s => <option key={s.id} value={s.id}>{s.name}{s.grade ? " · Grade " + s.grade : ""}</option>)}
              </select>
            </div>
            {overall && (
              <div className="dues-overall">
                <div className="dues-overall-label">Total due (all students)</div>
                <div className="dues-overall-amt">{money(overall.totalAmount)}</div>
                <div className="muted">{overall.totalDays} pending day{overall.totalDays === 1 ? "" : "s"} · {overall.studentsOwing} student{overall.studentsOwing === 1 ? "" : "s"}</div>
              </div>
            )}
          </div>
          {!sel ? null :
            loading ? <p className="muted" style={{ marginTop: 14 }}>Loading…</p> :
            classes.length === 0 ? <p className="muted" style={{ marginTop: 14 }}>{chosen && chosen.name} is not enrolled in any class.</p> :
            <div style={{ marginTop: 16 }}>
              <div className="dues-summary">
                <span>Total pending for <b>{chosen && chosen.name}</b>:</span>
                <span className="dues-grand">{money(grandTotal)}</span>
                <span className="muted">· {grandDays} day{grandDays === 1 ? "" : "s"} across {perClass.filter(c => c.pendingCount > 0).length} class{perClass.filter(c => c.pendingCount > 0).length === 1 ? "" : "es"}</span>
              </div>

              {perClass.map(c => (
                <div className="dues-class" key={c.classId}>
                  <div className="row-between">
                    <h4 style={{ margin: 0 }}>{c.className}
                      <span className="muted" style={{ fontWeight: 400, fontSize: "0.8rem" }}>
                        {" "}· {[c.subject, c.dayOfWeek, money(c.monthlyFee) + "/day"].filter(Boolean).join(" · ")}
                      </span>
                    </h4>
                    <span className={c.pendingCount > 0 ? "dues-amt" : "muted"}>
                      {c.pendingCount > 0 ? money(c.pendingTotal) + " · " + c.pendingCount + " day" + (c.pendingCount === 1 ? "" : "s") : "No dues ✓"}
                    </span>
                  </div>
                  {c.pendingCount > 0 &&
                    <div className="dues-days">
                      {c.pendingDays.map((d, i) => <span className="dues-chip" key={i}>🔴 {fmtDate(d.date)}</span>)}
                    </div>
                  }
                </div>
              ))}
            </div>
          }
        </div>
      );
    }

      const [file, setFile] = useState(null);
      const [title, setTitle] = useState("");
      const [busy, setBusy] = useState(false);
      const fileRef = useRef();

      async function upload(e) {
        e.preventDefault();
        if (!file) { alert("Choose a file first"); return; }
        setBusy(true);
        try {
          const fd = new FormData();
          fd.append("file", file);
          fd.append("title", title || file.name);
          fd.append("category", "NOTE");
          fd.append("grade", grade);
          fd.append("lessonId", lesson.id);
          await api.resources.upload(fd);
          setTitle(""); setFile(null); if (fileRef.current) fileRef.current.value = "";
          onChange();
        } catch (e) { alert(e.message); } finally { setBusy(false); }
      }
      async function delNote(id) {
        if (!confirm("Delete this note?")) return;
        try { await api.resources.remove(id); onChange(); } catch (e) { alert(e.message); }
      }

      return (
        <div className="card">
          <div className="row-between">
            <h3 style={{ margin: 0 }}>{lesson.lessonNo ? "Lesson " + lesson.lessonNo + ": " : ""}{lesson.title}</h3>

          {lesson.description && <p className="muted">{lesson.description}</p>}

          {notes.length === 0 ? <p className="muted">No notes uploaded yet.</p> :
            <ul className="file-list">
              {notes.map(n => (
                <li key={n.id}>
                  <span>📄 {n.title} <span className="muted">({n.originalName})</span></span>

                    <button className="link-btn danger" onClick={() => delNote(n.id)}>Delete</button>
                  </span>
                </li>
              ))}
            </ul>
          }

          <form onSubmit={upload} className="form-inline">
            <input type="file" ref={fileRef} onChange={e => setFile(e.target.files[0])} />
            <input placeholder="Note title (optional)" value={title} onChange={e => setTitle(e.target.value)} />
            <button className="btn-inline" disabled={busy}>{busy ? "Uploading…" : "Upload note"}</button>
          </form>
        </div>
      );
    }

    /** Teacher: large month calendar of every class date, labelled like "Grade 10 EM". */
    function CalendarPanel() {
      const now = new Date();
      const [ym, setYm] = useState({ y: now.getFullYear(), m: now.getMonth() });   // m = 0..11
      const [entries, setEntries] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        (async () => {
          try { setEntries(await api.classes.calendar()); } catch (e) { alert(e.message); }
          finally { setLoading(false); }
        })();
      }, []);

      const pad = (n) => String(n).padStart(2, "0");
      const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      const todayIso = iso(new Date());
      const MED = { english: "EM", sinhala: "SM", tamil: "TM" };
      const label = (c) => "Grade " + c.grade + (c.medium ? " " + (MED[c.medium.trim().toLowerCase()] || c.medium) : "")
        + (c.startTime ? " · " + fmtTime(c.startTime) : "");

      // date -> entries
      const byDate = {};
      entries.forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });

      // Build the weeks (Mon-first) covering the visible month.
      const first = new Date(ym.y, ym.m, 1);
      const offset = (first.getDay() + 6) % 7;                 // Mon=0 … Sun=6
      const start = new Date(ym.y, ym.m, 1 - offset);
      const daysInMonth = new Date(ym.y, ym.m + 1, 0).getDate();
      const weeks = Math.ceil((offset + daysInMonth) / 7);
      const cells = Array.from({ length: weeks * 7 }, (_, i) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));

      const monthCount = cells.filter(d => d.getMonth() === ym.m).reduce((n, d) => n + (byDate[iso(d)] || []).length, 0);
      const shift = (delta) => setYm(({ y, m }) => { const d = new Date(y, m + delta, 1); return { y: d.getFullYear(), m: d.getMonth() }; });
      const title = new Date(ym.y, ym.m, 1).toLocaleString("en", { month: "long", year: "numeric" });

      return (
        <div className="card">
          <div className="cal-head">
            <h3 style={{ margin: 0 }}>Class calendar</h3>
            <div className="cal-nav">
              <button className="link-btn" onClick={() => shift(-1)} aria-label="Previous month">◀</button>
              <span className="cal-title">{title}</span>
              <button className="link-btn" onClick={() => shift(1)} aria-label="Next month">▶</button>
              <button className="link-btn" onClick={() => setYm({ y: now.getFullYear(), m: now.getMonth() })}>Today</button>
            </div>
          </div>
          {loading ? <p className="muted">Loading…</p> :
            <div className="cal-scroll">
              <div className="cal-grid">
                {["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => <div className="cal-dow" key={d}>{d}</div>)}
                {cells.map(d => {
                  const key = iso(d);
                  const inMonth = d.getMonth() === ym.m;
                  return (
                    <div key={key} className={"cal-cell" + (inMonth ? "" : " out") + (key === todayIso ? " today" : "")}>
                      <div className="cal-daynum">{d.getDate()}</div>
                      {(byDate[key] || []).map((c, i) => (
                        <div key={i} className={"cal-chip g" + c.grade + (c.status !== "ACTIVE" ? " off" : "")} title={c.className}>{label(c)}</div>
                      ))}
                    </div>
                  );
                })}
              </div>
            </div>
          }
          {!loading && monthCount === 0 && <p className="muted" style={{ marginBottom: 0 }}>No class dates this month.</p>}
        </div>
      );
    }

          <div className="row-between" style={{ marginBottom: 14 }}>
            <h2 style={{ margin: 0 }}>Classes &amp; Fees</h2>
            {!editing && <button className="btn-inline" onClick={() => setEditing({})}>+ New class</button>}
          </div>

          {editing && <ClassForm initial={editing} onSave={saveClass} onCancel={() => setEditing(null)} />}

          {loading ? <p className="muted">Loading…</p> :
            classes.length === 0 ? (!editing && <div className="card"><p className="muted" style={{ margin: 0 }}>No classes yet. Click “+ New class” to add one.</p></div>) :
            <div className="class-grid">
              {classes.map(c => (
                <ClassCard key={c.id} c={c} selected={selectedId === c.id}
                  onSelect={() => setSelectedId(selectedId === c.id ? null : c.id)}
                  onEdit={() => setEditing(c)} onDelete={() => delClass(c)} />

          }

          {selected && (
            <div className="class-detail">
              <h3 className="detail-title">{selected.name}{selected.grade ? " · Grade " + selected.grade : ""}</h3>
              <div className="detail-grid">
                <ClassSessions classId={selected.id} />
                <ClassFees classId={selected.id} monthlyFee={selected.monthlyFee} />

            </div>

        </div>
      );

            <span className={"status-badge " + (c.status === "ACTIVE" ? "st-active" : "st-inactive")}>{c.status === "ACTIVE" ? "Active" : "Inactive"}</span>
            <span className="cc-actions" onClick={e => e.stopPropagation()}>
              <button className="link-btn" onClick={onEdit}>Edit</button>
              <button className="link-btn danger" onClick={onDelete}>Delete</button>
            </span>
          </div>
          <h3 className="cc-name">{c.name}</h3>
          <p className="cc-sub muted">{[c.subject, c.grade ? "Grade " + c.grade : null, c.medium].filter(Boolean).join(" · ") || "—"}</p>
          <div className="cc-meta">
            <span>📅 {c.dayOfWeek || "—"}{c.startTime ? " · " + fmtRange(c.startTime, c.endTime) : ""}</span>

    function ClassForm({ initial, onSave, onCancel }) {
      const isEdit = !!initial.id;
      const [name, setName] = useState(initial.name || "");
      const [subject, setSubject] = useState(initial.subject || "");
      const [grade, setGrade] = useState(initial.grade || 11);
      const [medium, setMedium] = useState(initial.medium || "English");
      const [monthlyFee, setMonthlyFee] = useState(initial.monthlyFee != null ? initial.monthlyFee : "");
      const [dayOfWeek, setDayOfWeek] = useState(initial.dayOfWeek || "Monday");
      const [status, setStatus] = useState(initial.status || "ACTIVE");
      const [startTime, setStartTime] = useState(initial.startTime || "");
      const [endTime, setEndTime] = useState(initial.endTime || "");
      const [showOnTimetable, setShowOnTimetable] = useState(initial.showOnTimetable !== false);
      const [busy, setBusy] = useState(false);

      async function submit(e) {
        e.preventDefault();
        if (!name.trim()) { alert("Class name is required"); return; }
        if (startTime && endTime && endTime <= startTime) { alert("End time must be after the start time"); return; }
        setBusy(true);
        try {
          await onSave({ name, subject, grade: Number(grade), medium,
            monthlyFee: monthlyFee === "" ? null : Number(monthlyFee), dayOfWeek, status,
            startTime: startTime || null, endTime: endTime || null, showOnTimetable }, initial.id);
        } catch (e) { alert(e.message); } finally { setBusy(false); }
      }
      return (
        <div className="card class-form">
          <h3 style={{ marginTop: 0 }}>{isEdit ? "Edit class" : "New class"}</h3>
          <form onSubmit={submit} className="cf-grid">
            <label>Class name<input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Mathematics - Grade 11" required /></label>
            <label>Subject<input value={subject} onChange={e => setSubject(e.target.value)} placeholder="e.g. Mathematics" /></label>
            <label>Grade<select value={grade} onChange={e => setGrade(e.target.value)}>{STUDENT_GRADES.map(g => <option key={g} value={g}>Grade {g}</option>)}</select></label>
            <label>Medium<select value={medium} onChange={e => setMedium(e.target.value)}>{CLASS_MEDIUMS.map(m => <option key={m} value={m}>{m}</option>)}</select></label>
            <label>Monthly fee (Rs.)<input type="number" min="0" value={monthlyFee} onChange={e => setMonthlyFee(e.target.value)} placeholder="e.g. 2500" /></label>
            <label>Day of week<select value={dayOfWeek} onChange={e => setDayOfWeek(e.target.value)}>{CLASS_DAYS.map(d => <option key={d} value={d}>{d}</option>)}</select></label>
            <label>Start time<input type="time" value={startTime} onChange={e => setStartTime(e.target.value)} /></label>
            <label>End time<input type="time" value={endTime} onChange={e => setEndTime(e.target.value)} /></label>
            <label>Status<select value={status} onChange={e => setStatus(e.target.value)}><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option></select></label>
            <label className="cf-check"><input type="checkbox" checked={showOnTimetable} onChange={e => setShowOnTimetable(e.target.checked)} />
              <span>Show on the home-page timetable <span className="muted" style={{ fontWeight: 400 }}>(untick for private classes)</span></span></label>
            <div className="cf-actions">
              <button className="btn-inline" disabled={busy}>{busy ? "Saving…" : (isEdit ? "Save changes" : "Create class")}</button>
              <button type="button" className="link-btn" onClick={onCancel}>Cancel</button>
            </div>
          </form>
        </div>
      );
    }

    function ClassSessions({ classId }) {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [newDate, setNewDate] = useState("");
      const [editId, setEditId] = useState(null);
      const [editDate, setEditDate] = useState("");

      async function load() {
        setLoading(true);
        try { setItems(await api.classes.sessions(classId)); } catch (e) { alert(e.message); } finally { setLoading(false); }
      }
      useEffect(() => { load(); }, [classId]);

      async function add(e) {
        e.preventDefault();
        if (!newDate) return;
        try { await api.classes.addSession(classId, newDate); setNewDate(""); load(); } catch (e) { alert(e.message); }
      }
      async function saveEdit(id) {
        if (!editDate) return;
        try { await api.classes.editSession(classId, id, editDate); setEditId(null); load(); } catch (e) { alert(e.message); }
      }
      async function del(id) {
        if (!confirm("Delete this class date?")) return;
        try { await api.classes.deleteSession(classId, id); load(); } catch (e) { alert(e.message); }
      }

      return (
        <div className="card">
          <h3 style={{ marginTop: 0 }}>Class Sessions</h3>
          <form onSubmit={add} className="form-inline" style={{ marginBottom: 12 }}>
            <input type="date" value={newDate} onChange={e => setNewDate(e.target.value)} />
            <button className="btn-inline">Add date</button>
          </form>
          {loading ? <p className="muted">Loading…</p> :
            items.length === 0 ? <p className="muted">No dates yet.</p> :
            <ul className="date-list">
              {items.map(s => (
                <li key={s.id}>
                  {editId === s.id ? (
                    <React.Fragment>
                      <input type="date" value={editDate} onChange={e => setEditDate(e.target.value)} />
                      <span className="date-actions">
                        <button className="link-btn" onClick={() => saveEdit(s.id)}>Save</button>
                        <button className="link-btn" onClick={() => setEditId(null)}>Cancel</button>
                      </span>
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <span>📅 {fmtDate(s.date)}</span>
                      <span className="date-actions">
                        <button className="link-btn" onClick={() => { setEditId(s.id); setEditDate(s.date); }}>Edit</button>
                        <button className="link-btn danger" onClick={() => del(s.id)}>Delete</button>
                      </span>
                    </React.Fragment>
                  )}
                </li>
              ))}
            </ul>
          }
        </div>
      );

    function ClassFees({ classId, monthlyFee }) {
      const [students, setStudents] = useState([]);   // enrolled students
      const [dates, setDates] = useState([]);          // class sessions
      const [entries, setEntries] = useState({});      // "sessionId_studentId" -> {status, amount, paidOn}
      const [avail, setAvail] = useState([]);
      const [pick, setPick] = useState("");
      const [selected, setSelected] = useState(null);  // which student's date-list is shown
      const [loading, setLoading] = useState(true);

      const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
      const keyOf = (sid, stid) => sid + "_" + stid;
      const entryOf = (sid, stid) => entries[keyOf(sid, stid)] || { status: "PENDING", amount: null, paidOn: null };

      async function load() {
        setLoading(true);
        try {
          const [fs, ss, sp, av] = await Promise.all([
            api.classes.fees(classId), api.classes.sessions(classId),
            api.classes.sessionPayments(classId), api.classes.available(classId),
          ]);
          setStudents(fs); setDates(ss); setAvail(av); setPick("");
          const map = {};
          sp.forEach(p => { map[keyOf(p.sessionId, p.studentId)] = { status: p.status, amount: p.amount, paidOn: p.paidOn }; });
          setEntries(map);
          setSelected(prev => (prev && fs.some(f => f.studentId === prev)) ? prev : (fs[0] ? fs[0].studentId : null));
        } catch (e) { alert(e.message); } finally { setLoading(false); }
      }
      useEffect(() => { load(); }, [classId]);

      // Persist an entry (optimistic; reload on error).
      async function save(sessionId, studentId, entry) {
        setEntries(m => ({ ...m, [keyOf(sessionId, studentId)]: entry }));
        try { await api.classes.setSessionPayment(classId, sessionId, studentId, entry.status, entry.amount, entry.paidOn); }
        catch (e) { alert(e.message); load(); }
      }
      // Changing the status: marking PAID pre-fills the monthly fee + today's date.
      function changeStatus(sessionId, studentId, status) {
        const prev = entryOf(sessionId, studentId);
        const entry = (status === "PAID")
          ? { status, amount: prev.amount != null ? prev.amount : (monthlyFee ?? null), paidOn: prev.paidOn || todayISO() }
          : { status, amount: null, paidOn: null };
        save(sessionId, studentId, entry);
      }
      async function addStudent(e) {
        e.preventDefault();
        if (!pick) return;
        try { await api.classes.enroll(classId, Number(pick)); load(); } catch (e) { alert(e.message); }
      }
      async function remove(studentId, name) {
        if (!confirm("Remove " + name + " from this class?")) return;
        try { await api.classes.unenroll(classId, studentId); load(); } catch (e) { alert(e.message); }
      }

      const current = students.find(s => s.studentId === selected);

      // Payment log for the selected student — most recently received first.
      const history = dates
        .map(d => ({ date: d.date, ...entryOf(d.id, selected) }))
        .filter(x => x.status === "PAID" && x.paidOn)
        .sort((a, b) => (a.paidOn < b.paidOn ? 1 : -1));
      const totalReceived = history.reduce((n, h) => n + (h.amount || 0), 0);

      return (
        <div className="card">
          <h3 style={{ marginTop: 0 }}>Student Fees
            <span className="muted" style={{ fontWeight: 400, fontSize: "0.8rem" }}> · {money(monthlyFee)}/mo · status per date</span>
          </h3>
          <form onSubmit={addStudent} className="form-inline" style={{ marginBottom: 12 }}>
            <select value={pick} onChange={e => setPick(e.target.value)}>
              <option value="">{avail.length ? "Select a student to add…" : "No more students to add"}</option>
              {avail.map(s => <option key={s.id} value={s.id}>{s.name}{s.grade ? " · Grade " + s.grade : ""}</option>)}
            </select>
            <button className="btn-inline" disabled={!pick}>+ Add student</button>
          </form>
          {loading ? <p className="muted">Loading…</p> :
            students.length === 0 ? <p className="muted">No students added yet — use the dropdown above to add students to this class.</p> :
            <div>
              <div className="row-between" style={{ marginBottom: 12 }}>
                <select value={selected || ""} onChange={e => setSelected(Number(e.target.value))}>
                  {students.map(s => <option key={s.studentId} value={s.studentId}>{s.studentName}</option>)}
                </select>
                {current && <button className="link-btn danger" onClick={() => remove(current.studentId, current.studentName)}>Remove from class</button>}
              </div>
              {dates.length === 0 ? <p className="muted">Add class dates on the left to record day-wise fees.</p> :
                <div className="table-wrap">
                  <table className="table fee-table">
                    <thead><tr><th>Date</th><th>Payment Status</th><th>Amount</th><th>Received on</th></tr></thead>
                    <tbody>
                      {dates.map(d => {
                        const e = entryOf(d.id, selected);
                        const paid = e.status === "PAID";
                        return (
                          <tr key={d.id}>
                            <td>{fmtDate(d.date)}</td>
                            <td>
                              <select className={"fee-badge fee-" + e.status.toLowerCase()}
                                value={e.status} onChange={ev => changeStatus(d.id, selected, ev.target.value)}>
                                {FEE_OPTIONS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                              </select>
                            </td>
                            <td>{paid
                              ? <input type="number" className="pay-amt" min="0" placeholder={monthlyFee || "0"}
                                  value={e.amount ?? ""}
                                  onChange={ev => setEntries(m => ({ ...m, [keyOf(d.id, selected)]: { ...e, amount: ev.target.value === "" ? null : Number(ev.target.value) } }))}
                                  onBlur={ev => save(d.id, selected, { status: "PAID", amount: ev.target.value === "" ? null : Number(ev.target.value), paidOn: e.paidOn })} />
                              : <span className="muted">—</span>}</td>
                            <td>{paid
                              ? <input type="date" className="pay-date" value={e.paidOn || ""}
                                  onChange={ev => save(d.id, selected, { status: "PAID", amount: e.amount, paidOn: ev.target.value || null })} />
                              : <span className="muted">—</span>}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              }
              {history.length > 0 && (
                <div className="pay-history">
                  <div className="row-between">
                    <h4 style={{ margin: "0 0 6px" }}>Payment history — {current && current.studentName}</h4>
                    <span className="muted">Total received: {money(totalReceived)}</span>
                  </div>
                  <ul className="file-list" style={{ margin: 0 }}>
                    {history.map((h, i) => (
                      <li key={i}>
                        <span>💰 Received <b>{fmtDate(h.paidOn)}</b> <span className="muted">· {money(h.amount)}</span></span>
                        <span className="muted">for class on {fmtDate(h.date)}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              )}
            </div>
          }
        </div>
      );
    }

    function StudentHome({ user }) {

            // Only nag once it piles up: 4+ pending days.

      }, []);

      return (
        <div>

            <div className="modal-overlay" onClick={() => setShowPay(false)}>

    function StudentAssignmentItem({ a, sub, onChange }) {
      const [file, setFile] = useState(null);
      const [busy, setBusy] = useState(false);
      const fileRef = useRef();
      async function submit(e) {
        e.preventDefault();
        if (!file) { alert("Choose your answer file first"); return; }
        setBusy(true);
        try {
          const fd = new FormData();
          fd.append("assignmentId", a.id);
          fd.append("file", file);
          await api.submissions.submit(fd);
          setFile(null); if (fileRef.current) fileRef.current.value = "";
          onChange();
        } catch (e) { alert(e.message); } finally { setBusy(false); }
      }
      return (
        <div className="card">
          <div className="row-between">
            <h3 style={{ margin: 0 }}>{a.title} <span className="muted" style={{ fontWeight: "normal", fontSize: "0.8em" }}>· Grade {a.grade}</span></h3>
            {a.dueDate && <span className="muted">Due {a.dueDate}</span>}
          </div>
          {a.description && <p className="muted">{a.description}</p>}
          {a.hasQuestionFile &&
            <button className="link-btn" style={{ marginLeft: 0 }} onClick={() => api.downloadFile(api.assignments.questionUrl(a.id), a.questionOriginalName)}>Download question</button>}
          <hr className="sep" />
          {sub ? (
            <div>
              <p style={{ margin: "6px 0" }}>✅ Submitted: <b>{sub.originalName}</b> <span className="muted">on {new Date(sub.submittedAt).toLocaleString()}</span></p>
              {sub.marks != null ? (
                <div className="graded">
                  <b>Marks: {sub.marks}</b>
                  {sub.feedback && <p style={{ margin: "6px 0 0" }}><span className="muted">Feedback:</span> {sub.feedback}</p>}
                </div>
              ) : <p className="muted">Not marked yet.</p>}
            </div>
          ) : <p className="muted">Not submitted yet.</p>}
          <form onSubmit={submit} className="form-inline" style={{ marginTop: 10 }}>
            <input type="file" ref={fileRef} onChange={e => setFile(e.target.files[0])} />
            <button className="btn-inline" disabled={busy}>{busy ? "Uploading…" : (sub ? "Re-submit" : "Submit answer")}</button>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
