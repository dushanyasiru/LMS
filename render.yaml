# Render Blueprint — deploys the Spring Boot LMS as a Docker web service.
# On Render: New + -> Blueprint -> pick the dushanyasiru/LMS repo.
# Render reads this file, then prompts you for the secret values below.
services:
  - type: web
    name: stack-ict-academy-lms
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false          # you paste the Supabase session-pooler JDBC URL
      - key: SPRING_DATASOURCE_USERNAME
        sync: false          # postgres.wagpmreukskswqvgbwci
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false          # your DB password
      - key: APP_JWT_SECRET
        sync: false          # the long secret from application-secret.properties
      - key: APP_JWT_EXPIRATION_HOURS
        value: "12"
      - key: APP_SEED_TEACHER_EMAIL
        sync: false
      - key: APP_SEED_TEACHER_NAME
        sync: false
      - key: APP_SEED_TEACHER_PASSWORD
        sync: false
